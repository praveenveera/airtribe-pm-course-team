    }

    function alternativeReasons(method) {
      if (["supermarket", "local_market", "local_store", "bulk_purchase", "subscription", "bigbasket", "amazon_fresh"].indexOf(method) !== -1) {
        return [option("larger_quantity_value", "Better value for larger quantities"), option("planned_trip", "I already planned to shop or order there"), option("close_convenient", "Closer or more convenient"), option("quality_freshness", "More confidence in quality or freshness"), option("availability", "Better product availability or pack sizes"), option("habit", "Habit or household preference"), option("no_fast_delivery_need", "I did not need fast delivery"), option("other", "Other")];
      }
      return [option("delivery_reliability", "Faster or more reliable delivery"), option("price_offer", "Better price or offer"), option("availability", "Better product availability"), option("familiar_app", "More familiar app or habit"), option("quality_pack", "Better quality or pack sizes"), option("convenience", "More convenient for this purchase"), option("other", "Other")];
    }

    function render(focusHeading) {
      if (state.done) return renderThankYou();
      var ids = steps();
      if (state.index >= ids.length) state.index = ids.length - 1;
      var id = ids[state.index];
      var app = document.getElementById("app"); app.innerHTML = "";
      document.documentElement.lang = state.lang;
      document.body.className = state.lang === "en" ? "" : "lang-" + state.lang;
      document.getElementById("brand").textContent = ui("brand");
      document.getElementById("languageToggle").setAttribute("aria-label", ui("language"));
      document.title = ui("brand") + " — " + ui("shortSurvey");
      document.querySelectorAll("[data-lang]").forEach(function (button) { button.setAttribute("aria-pressed", button.getAttribute("data-lang") === state.lang ? "true" : "false"); });
      document.getElementById("progress").style.width = state.index === 0 ? "0%" : Math.min(94, 6 + state.index * 6) + "%";

      if (id === "welcome") {
        app.appendChild(element("div", { className: "intro-mark", text: "B" }));
        app.appendChild(element("div", { className: "kicker", text: ui("shortSurvey") }));
        app.appendChild(element("h1", { text: ui("title") }));
        app.appendChild(element("p", { className: "hint", text: ui("welcomeBody") }));
        var consent = element("label", { className: "consent" });
        var checkbox = element("input", { type: "checkbox", id: "consent" }); checkbox.checked = state.consent;
        checkbox.addEventListener("change", function () { state.consent = checkbox.checked; });
        consent.appendChild(checkbox);
        consent.appendChild(element("span", { text: ui("consent") }));
        app.appendChild(consent);
        app.appendChild(element("p", { className: "privacy-note", text: ui("privacy") }));
        updateNavigation(); return;
      }

      if (id === "categories" && state.answers.categories === undefined && state.answers.firstNeed && state.answers.firstNeed !== "other") {
        state.answers.categories = [state.answers.firstNeed];
      }

      app.appendChild(element("div", { className: "kicker", text: ui("question") + " " + state.index }));
      var heading = element("h2", { id: "questionHeading", tabindex: "-1", text: question(id) }); app.appendChild(heading);
      if (id === "categories" || id === "expansionPattern") app.appendChild(element("p", { className: "hint", text: ui("selectAll") }));
      if (id === "categories" && state.answers.firstNeed && state.answers.firstNeed !== "other") {
        app.appendChild(element("p", { className: "hint", text: ui("categoriesCarried") }));
      }
      if (id === "channelMix") {
        app.appendChild(element("p", { className: "hint", text: ui("aboutYouHint") }));
      }

      if (id === "zeptoCheckoutMoment") {
        app.appendChild(element("p", { className: "hint", text: ui("decisionHint") }));
        app.appendChild(textField(id, true));
      } else if (id === "altZeptoGap" || id === "city") {
        app.appendChild(element("p", { className: "hint", text: ui(id === "city" ? "optionalCityHint" : "optionalHint") }));
        app.appendChild(textField(id, false));
      } else {
        app.appendChild(renderOptions(id, optionsFor(id), id === "categories" || id === "expansionPattern"));
      }

      updateNavigation();
      if (focusHeading !== false) window.requestAnimationFrame(function () { heading.focus(); });
    }

    function valid() {
      var id = currentId();
      if (id === "welcome") return state.consent;
      if (id === "zeptoCheckoutMoment") return String(state.answers[id] || "").trim().length >= 8;
      if (id === "altZeptoGap" || id === "city") return true;
      var value = state.answers[id];
      if (id === "categories" || id === "expansionPattern") {
        if (!Array.isArray(value) || value.length === 0) return false;
      } else if (value === undefined || value === null || value === "") return false;
      if (hasOther(id) && !String(state.answers[id + "Other"] || "").trim()) return false;
      return true;
    }

    function updateNavigation() {
      var ids = steps(); var id = ids[state.index];
      var last = state.index === ids.length - 1 && !(id === "recentMethod" && !state.answers.recentMethod);
      document.getElementById("backBtn").classList.toggle("hidden", state.index === 0 || state.done);
      document.getElementById("backBtn").textContent = ui("back");
      document.getElementById("nextBtn").textContent = state.submitting ? ui("saving") : (last ? ui("submit") : (state.index === 0 ? ui("start") : ui("next")));
      document.getElementById("nextBtn").disabled = state.submitting;
    }

    function buildSubmission() {
      var a = state.answers; var eligible = isEligible();
      var consideredYes = a.considered === "yes";
      var immediateCheckout = Array.isArray(a.expansionPattern) && a.expansionPattern.indexOf("immediate_checkout") !== -1;
      var askedBasketStopWhy = eligible && !consideredYes && immediateCheckout;
      if (!state.responseId) state.responseId = createResponseId();
      var research = {
        responseId: state.responseId, clientTimestamp: new Date().toISOString(), surveyVersion: SURVEY_VERSION,
        language: state.lang, consent: true, eligible: eligible, recentMethod: a.recentMethod || "", recentMethodOther: a.recentMethodOther || "",
        mission: eligible ? (a.mission || "") : "", missionOther: eligible ? (a.missionOther || "") : "",
        firstNeed: eligible ? (a.firstNeed || "") : "", firstNeedOther: eligible ? (a.firstNeedOther || "") : "",
        householdSize: eligible ? (a.householdSize || "") : "", items: eligible ? (a.items || "") : "", spend: eligible ? (a.spend || "") : "",
        categories: eligible ? (a.categories || []) : [], categoriesOther: eligible ? (a.categoriesOther || "") : "",
        expansionPattern: eligible ? (a.expansionPattern || []) : [], considered: eligible ? (a.considered || "") : "",
        consideredCategory: eligible && consideredYes ? (a.consideredCategory || "") : "",
        consideredCategoryOther: eligible && consideredYes ? (a.consideredCategoryOther || "") : "",
        stopReason: eligible && consideredYes ? (a.stopReason || "") : "", stopReasonOther: eligible && consideredYes ? (a.stopReasonOther || "") : "",
        basketStopWhy: askedBasketStopWhy ? (a.basketStopWhy || "") : "", basketStopWhyOther: askedBasketStopWhy ? (a.basketStopWhyOther || "") : "",
        thresholdNoticed: eligible ? (a.thresholdNoticed || "") : "", thresholdAction: eligible && a.thresholdNoticed === "yes" ? (a.thresholdAction || "") : "",
        thresholdActionOther: eligible && a.thresholdNoticed === "yes" ? (a.thresholdActionOther || "") : "",
        zeptoWhy: eligible && isZepto() ? (a.zeptoWhy || "") : "", zeptoWhyOther: eligible && isZepto() ? (a.zeptoWhyOther || "") : "",
        zeptoCheckoutMoment: eligible && isZepto() ? (a.zeptoCheckoutMoment || "") : "",
        altWhy: eligible && !isZepto() ? (a.altWhy || "") : "", altWhyOther: eligible && !isZepto() ? (a.altWhyOther || "") : "",
        consideredZepto: eligible && !isZepto() ? (a.consideredZepto || "") : "",
        altZeptoGap: eligible && !isZepto() ? String(a.altZeptoGap || "").trim() : "",
        receptivity: eligible ? (a.receptivity || "") : "",
        channelMix: eligible ? (a.channelMix || "") : "", channelMixOther: eligible ? (a.channelMixOther || "") : "",
        city: eligible ? String(a.city || "").trim() : "", ageBracket: eligible ? (a.ageBracket || "") : "", lifeStage: eligible ? (a.lifeStage || "") : ""
      };
      return { research: research };
    }

    function createResponseId() {
      if (window.crypto && window.crypto.getRandomValues) {
        var values = new Uint32Array(3); window.crypto.getRandomValues(values);
        return "BS2-" + Array.prototype.map.call(values, function (value) { return value.toString(16).padStart(8, "0"); }).join("");
      }
      return "BS2-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
    }

    function confirmSubmission(responseId, attempt) {
      return new Promise(function (resolve, reject) {
        var callbackName = "basketStoriesConfirm_" + Date.now() + "_" + attempt;
        var script = document.createElement("script"); var settled = false;
        function cleanup() { if (script.parentNode) script.parentNode.removeChild(script); delete window[callbackName]; }
        function retryOrReject() {
          cleanup();
          if (attempt < 5) setTimeout(function () { confirmSubmission(responseId, attempt + 1).then(resolve, reject); }, 900);
          else reject(new Error("The response could not be confirmed in the response sheet."));
        }
        window[callbackName] = function (result) {
          if (settled) return; settled = true;
          if (result && result.found) { cleanup(); resolve(); } else retryOrReject();
        };
        script.onerror = function () { if (!settled) { settled = true; retryOrReject(); } };
        script.src = APPS_SCRIPT_URL + "?responseId=" + encodeURIComponent(responseId) + "&callback=" + encodeURIComponent(callbackName) + "&_=" + Date.now();
        document.body.appendChild(script);
        setTimeout(function () { if (!settled) { settled = true; retryOrReject(); } }, 4000);
      });
    }

    function submitSurvey() {
      state.submitting = true; clearError(); updateNavigation();
      var payload = buildSubmission();
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_") === 0) {
        localStorage.setItem("basketStoriesPilotV2", JSON.stringify(payload.research));
        state.localOnly = true; state.submitting = false; state.done = true; renderThankYou(); return;
      }
      fetch(APPS_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
        .then(function () { return confirmSubmission(payload.research.responseId, 1); })
        .then(function () { state.submitting = false; state.done = true; renderThankYou(); })
        .catch(function () { state.submitting = false; updateNavigation(); showError(ui("confirmError")); });
    }

    function clearError() { var old = document.querySelector(".error"); if (old) old.remove(); }
    function showError(message) { clearError(); document.getElementById("app").appendChild(element("div", { className: "error", role: "alert", text: message })); }
    function renderThankYou() {
      var app = document.getElementById("app"); app.innerHTML = "";
      var box = element("div", { className: "success" });
      box.appendChild(element("h1", { text: state.localOnly ? ui("localTitle") : ui("thanks") }));
      box.appendChild(element("p", { text: state.localOnly ? ui("localBody") : (isEligible() ? ui("confirmedBody") : ui("ineligibleBody")) }));
      app.appendChild(box); document.getElementById("progress").style.width = "100%";
      document.getElementById("nextBtn").classList.add("hidden"); document.getElementById("backBtn").classList.add("hidden");
    }

    document.getElementById("nextBtn").addEventListener("click", function () {
      if (!valid()) { showError(ui("required")); return; }
      clearError(); if (state.index === steps().length - 1) { submitSurvey(); return; } state.index++; render(true);
    });
    document.getElementById("backBtn").addEventListener("click", function () { if (state.index > 0) { state.index--; render(true); } });
    document.querySelectorAll("[data-lang]").forEach(function (button) {
      button.addEventListener("click", function () { state.lang = button.getAttribute("data-lang"); render(false); });
    });
    render(false);
  </script>
</body>
</html>
