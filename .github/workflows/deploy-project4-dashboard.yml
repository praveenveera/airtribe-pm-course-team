name: Deploy Project 4 dashboard

on:
  push:
    branches: [main]
    paths:
      - 'projects/zepto-increasing-aov/dashboard/**'
      - '.github/workflows/deploy-project4-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/zepto-increasing-aov/dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
