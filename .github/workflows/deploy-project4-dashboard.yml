name: Deploy course site and Project 4 dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble dashboard, survey, and masterclass
        run: |
          mkdir -p _site/survey _site/masterclass/diagrams
          cp -r projects/zepto-increasing-aov/dashboard/* _site/
          cp projects/zepto-increasing-aov/webapp/index.html _site/survey/index.html
          cp learning/masterclass/index.html learning/masterclass/styles-v2.css learning/masterclass/styles-v3.css learning/masterclass/app.js learning/masterclass/search.js learning/masterclass/curriculum.js learning/masterclass/mastery.js learning/masterclass/textbook.js learning/masterclass/domain-examples.js learning/masterclass/platform-examples.js learning/masterclass/daily.js learning/masterclass/concept-visuals.js learning/masterclass/simulations.js _site/masterclass/
          cp learning/masterclass/diagrams/market-scope.html _site/masterclass/diagrams/
          test -s _site/masterclass/index.html
          test -s _site/masterclass/search.js
          test -s _site/masterclass/curriculum.js
          test -s _site/masterclass/mastery.js
          test -s _site/masterclass/textbook.js
          test -s _site/masterclass/domain-examples.js
          test -s _site/masterclass/platform-examples.js
          test -s _site/masterclass/daily.js
          test -s _site/masterclass/concept-visuals.js
          test -s _site/masterclass/simulations.js
          test -s _site/masterclass/diagrams/market-scope.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
